<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナナホシナナ 歌枠アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a14;
  --bg2:#0e1020;
  --panel:rgba(255,255,255,.035);
  --line:rgba(190,175,235,.14);
  --line2:rgba(240,200,120,.28);
  --ink:#eae6f4;
  --dim:#9b93b8;
  --dim2:#6f6890;
  --gold:#f0c674;
  --gold2:#ffe1a3;
  --violet:#a48bd8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:72px;
  -webkit-font-smoothing:antialiased;
}
.sky{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.75),transparent),
    radial-gradient(1px 1px at 28% 62%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 44% 8%,rgba(255,240,200,.7),transparent),
    radial-gradient(1px 1px at 61% 41%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.4px 1.4px at 78% 22%,rgba(255,235,190,.8),transparent),
    radial-gradient(1px 1px at 88% 70%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 7% 84%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 52% 88%,rgba(255,255,255,.5),transparent),
    radial-gradient(ellipse 90% 55% at 50% -8%,rgba(140,110,210,.22),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg) 40%);
}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px}

/* ── Hero ── */
.hero{padding:44px 0 26px;text-align:center}
.crest{
  display:inline-flex;align-items:center;justify-content:center;
  width:46px;height:46px;margin-bottom:14px;
  border:1px solid var(--line2);border-radius:50%;
  color:var(--gold);
  box-shadow:0 0 26px rgba(240,198,116,.16),inset 0 0 18px rgba(240,198,116,.07);
}
h1{
  font-family:'Shippori Mincho',serif;font-weight:700;
  font-size:27px;letter-spacing:.14em;line-height:1.35;
}
h1 .sub{display:block;font-size:11px;letter-spacing:.42em;color:var(--gold);margin-top:9px;font-weight:500}
.stats{
  display:flex;justify-content:center;gap:0;margin-top:22px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:14px 0;
}
.stat{flex:1;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.stat b{display:block;font-family:'Shippori Mincho',serif;font-size:23px;color:var(--gold2);letter-spacing:.02em}
.stat span{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim2);margin-top:3px}

/* ── Controls ── */
.controls{position:sticky;top:0;z-index:20;padding:12px 0 10px;margin-top:22px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(9px)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim2);pointer-events:none}
#q{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:11px 14px 11px 38px;color:var(--ink);font-size:14.5px;font-family:inherit;outline:none;
  transition:border-color .25s,background .25s;
}
#q:focus{border-color:var(--line2);background:rgba(240,198,116,.05)}
#q::placeholder{color:var(--dim2)}
.tabs{display:flex;gap:2px;margin-top:9px}
.tab{
  flex:1;padding:8px 4px;background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--dim);font-size:12px;font-family:inherit;letter-spacing:.09em;cursor:pointer;
  transition:.2s;white-space:nowrap;
}
.tab:hover{color:var(--ink);border-color:var(--line2)}
.tab.on{background:rgba(240,198,116,.1);border-color:var(--line2);color:var(--gold2)}
.hits{font-size:11.5px;color:var(--dim2);letter-spacing:.08em;padding:9px 2px 0;min-height:20px}

/* ── Stream list ── */
.stream{border-bottom:1px solid var(--line);position:relative}
.stream-head{
  display:flex;align-items:flex-start;gap:12px;width:100%;
  padding:15px 34px 15px 4px;background:none;border:none;color:inherit;
  font-family:inherit;text-align:left;cursor:pointer;transition:background .2s;
}
.stream-head:hover{background:rgba(255,255,255,.025)}
.sdate{
  flex-shrink:0;width:66px;font-family:'Shippori Mincho',serif;
  color:var(--gold);font-size:12.5px;letter-spacing:.03em;line-height:1.45;padding-top:1px;
}
.sdate em{display:block;font-style:normal;font-size:10px;color:var(--dim2);letter-spacing:.1em}
.stitle{flex:1;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.55;word-break:break-word}
.scount{flex-shrink:0;font-size:11px;color:var(--dim2);letter-spacing:.06em;padding-top:2px}
.chev{flex-shrink:0;color:var(--dim2);transition:transform .28s;margin-top:3px}
.stream.open .chev{transform:rotate(90deg)}
.songs{display:none;padding:0 4px 16px 78px}
.stream.open .songs{display:block}
.song{
  display:flex;align-items:baseline;gap:10px;padding:6px 0;
  border-top:1px solid rgba(255,255,255,.045);
}
.song:first-child{border-top:none}
.num{flex-shrink:0;width:20px;font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums}
.sname{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
.sart{flex-shrink:0;max-width:42%;font-size:11.5px;color:var(--dim);text-align:right;word-break:break-word}
mark{background:rgba(240,198,116,.24);color:var(--gold2);border-radius:1px;padding:0 1px}

/* ── Rank list ── */
.rank{
  display:flex;align-items:baseline;gap:12px;padding:11px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s;
}
.rank:hover{background:rgba(255,255,255,.025)}
.rk{flex-shrink:0;width:32px;font-family:'Shippori Mincho',serif;font-size:14px;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.rmain{flex:1;min-width:0}
.rname{font-size:14px;word-break:break-word}
.rsub{font-size:11.5px;color:var(--dim);margin-top:2px}
.rnum{flex-shrink:0;font-size:11px;color:var(--dim2);letter-spacing:.05em}
.rnum b{font-family:'Shippori Mincho',serif;font-size:15px;color:var(--gold2);margin-right:2px}
.rdetail{display:none;padding:2px 4px 12px 48px}
.rank-item.open .rdetail{display:block}
.rdate{font-size:11.5px;color:var(--dim);padding:4px 0;border-top:1px solid rgba(255,255,255,.045)}
.rdate:first-child{border-top:none}

.sub-item{border-top:1px solid rgba(255,255,255,.045)}
.sub-item:first-child{border-top:none}
.sub-head{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;transition:color .2s}
.sub-head:hover .sub-name{color:var(--gold2)}
.sub-name{flex:1;min-width:0;font-size:13px;word-break:break-word;transition:color .2s}
.sub-n{flex-shrink:0;font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.sub-chev{flex-shrink:0;color:var(--dim2);transition:transform .28s}
.sub-item.open .sub-chev{transform:rotate(90deg)}
.sub-item.open .sub-name{color:var(--gold2)}
.sub-detail{display:none;padding:0 0 8px 10px;border-left:1px solid var(--line)}
.sub-item.open .sub-detail{display:block}
.sub-detail .rdate{font-size:11px;padding-left:8px}

.ylink{
  flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;margin-top:-1px;border:1px solid var(--line);border-radius:2px;
  color:var(--dim2);text-decoration:none;transition:.2s;
}
.ylink:hover{color:var(--gold2);border-color:var(--line2);background:rgba(240,198,116,.1)}
a.rdate{display:block;text-decoration:none;color:var(--dim);transition:color .2s}
a.rdate:hover{color:var(--gold2)}
a.rdate .go{color:var(--dim2);font-size:9.5px;margin-left:5px}
a.rdate:hover .go{color:var(--gold)}

.empty{text-align:center;color:var(--dim2);padding:64px 0;font-size:13.5px;letter-spacing:.06em}
footer{text-align:center;padding:40px 16px 0;font-size:11px;color:var(--dim2);letter-spacing:.09em;line-height:1.9}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">

    <div class="crest">

  <div class="controls">

    </div>
    <div class="tabs">
      <button class="tab on" data-v="stream">配信別</button>
      <button class="tab" data-v="song">曲ランキング</button>
      <button class="tab" data-v="artist">アーティスト</button>
    </div>
    <div class="hits" id="hits"></div>
  </div>

  <main id="out"></main>

  <footer>
    データ・構成：ナナホシナナ歌枠まとめ<br>
    <span id="updated"></span>
  </footer>
</div>

/* ---------- derive ---------- */
const flat = [];
DATA.forEach((st, si) => st.songs.forEach(([s, a]) => flat.push({ s, a, si })));

const songMap = new Map(), artMap = new Map();
flat.forEach(f => {
  const k = f.s + '\u0000' + f.a;
  if (!songMap.has(k)) songMap.set(k, { s: f.s, a: f.a, list: [] });
  songMap.get(k).list.push(f.si);
  if (!artMap.has(f.a)) artMap.set(f.a, { a: f.a, n: 0, songs: new Map() });
  const A = artMap.get(f.a); A.n++;
  if (!A.songs.has(f.s)) A.songs.set(f.s, []);
  A.songs.get(f.s).push(f.si);
});
const songs  = [...songMap.values()].sort((x, y) => y.list.length - x.list.length || x.s.localeCompare(y.s, 'ja'));
const artists = [...artMap.values()].sort((x, y) => y.n - x.n || x.a.localeCompare(y.a, 'ja'));

document.getElementById('stStreams').textContent = DATA.length;
document.getElementById('stSongs').textContent   = flat.length.toLocaleString();
document.getElementById('stUniq').textContent    = songs.length.toLocaleString();
document.getElementById('stArt').textContent     = artists.length.toLocaleString();
document.getElementById('updated').textContent   = '最終配信 ' + fmt(DATA[0].d);

/* ---------- helpers ---------- */
const PLAY='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(d){const p=d.split('-');return p[0]+'.'+p[1]+'.'+p[2]}
function fmtY(d){const p=d.split('-');return p[1]+'.'+p[2]}
function yr(d){return d.split('-')[0]}
function hl(t,q){
  const e=esc(t); if(!q) return e;
  const i=t.toLowerCase().indexOf(q);
  if(i<0) return e;
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}

function rdate(si){
  const st=DATA[si], inner=fmt(st.d)+'　'+esc(st.t);
  return st.u
    ? '<a class="rdate" href="'+esc(st.u)+'" target="_blank" rel="noopener">'+inner+'<span class="go">▶</span></a>'
    : '<div class="rdate">'+inner+'</div>';
}

let view='stream', q='';
const out=document.getElementById('out'), hits=document.getElementById('hits');

/* ---------- render ---------- */
function render(){
  if(view==='stream') renderStreams();
  else if(view==='song') renderRank(songs,'song');
  else renderRank(artists,'artist');
}

function renderStreams(){
  let shown=0, hit=0;
  const parts=[];
  DATA.forEach((st,i)=>{
    const titleHit = q && st.t.toLowerCase().includes(q);
    const matched = q ? st.songs.filter(([s,a])=>s.toLowerCase().includes(q)||a.toLowerCase().includes(q)) : [];
    if(q && !titleHit && !matched.length) return;
    shown++;
    const list = (q && matched.length && !titleHit) ? matched : st.songs;
    hit += (q ? (matched.length || st.songs.length) : 0);
    const open = q ? ' open' : '';
    parts.push(
      '<section class="stream'+open+'" data-i="'+i+'">'+
        '<button class="stream-head">'+
          '<span class="sdate">'+fmtY(st.d)+'<em>'+yr(st.d)+'</em></span>'+
          '<span class="stitle">'+hl(st.t,q)+'</span>'+
          '<span class="scount">'+st.songs.length+'</span>'+
          '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>'+
        '</button>'+
        (st.u ? '<a class="ylink" href="'+esc(st.u)+'" target="_blank" rel="noopener" title="配信を開く" style="position:absolute;right:2px;top:12px">'+PLAY+'</a>' : '')+
        '<div class="songs">'+ list.map(([s,a],n)=>
          '<div class="song"><span class="num">'+(n+1)+'</span>'+
          '<span class="sname">'+hl(s,q)+'</span>'+
          '<span class="sart">'+hl(a,q)+'</span></div>').join('') +
        '</div>'+
      '</section>');
  });
  out.innerHTML = parts.length ? parts.join('') : '<div class="empty">該当する記録が見つかりません</div>';
  hits.textContent = q ? shown+' 配信 / '+hit+' 曲がヒット' : DATA.length+' 配信 — タップでセットリストを開く';
}

function renderRank(arr,kind){
  const f = q ? arr.filter(x=> kind==='song'
        ? (x.s.toLowerCase().includes(q)||x.a.toLowerCase().includes(q))
        : x.a.toLowerCase().includes(q)) : arr;
  if(!f.length){ out.innerHTML='<div class="empty">該当する記録が見つかりません</div>'; hits.textContent='0 件'; return; }
  out.innerHTML = f.map((x,i)=>{
    const detail = kind==='song'
      ? x.list.map(rdate).join('')
      : [...x.songs.entries()]
          .sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'ja'))
          .map(([s,ls])=>
            '<div class="sub-item">'+
              '<div class="sub-head"><span class="sub-name">'+hl(s,q)+'</span>'+
                '<span class="sub-n">'+ls.length+'</span>'+
                '<svg class="sub-chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>'+
              '</div>'+
              '<div class="sub-detail">'+ls.map(rdate).join('')+'</div>'+
            '</div>').join('');
    return '<div class="rank-item">'+
      '<div class="rank">'+
        '<span class="rk">'+(i+1)+'</span>'+
        '<span class="rmain"><span class="rname">'+hl(kind==='song'?x.s:x.a,q)+'</span>'+
          '<span class="rsub">'+(kind==='song'?hl(x.a,q):x.songs.size+' 曲')+'</span></span>'+
        '<span class="rnum"><b>'+(kind==='song'?x.list.length:x.n)+'</b>回</span>'+
      '</div><div class="rdetail">'+detail+'</div></div>';
  }).join('');
  hits.textContent = f.length.toLocaleString()+' 件' + (q?'':' — タップで詳細');
}

/* ---------- events ---------- */
out.addEventListener('click',e=>{
  const h=e.target.closest('.stream-head');
  if(h){ h.parentElement.classList.toggle('open'); return; }
  const sh=e.target.closest('.sub-head');
  if(sh){ sh.parentElement.classList.toggle('open'); return; }
  const r=e.target.closest('.rank');
  if(r){ r.parentElement.classList.toggle('open'); }
});
document.getElementById('q').addEventListener('input',e=>{
  q=e.target.value.trim().toLowerCase(); render();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); view=t.dataset.v; render(); window.scrollTo({top:0});
}));

render();
</script>
